name: "Auto-merge Dependabot PRs"

on:
  pull_request_target:
    types: [opened, synchronize, labeled, unlabeled, reopened]

jobs:
  automerge:
    runs-on: ubuntu-latest
    # Only proceed when PR is opened by Dependabot or labeled as a dependency update
    if: |
      github.actor == 'dependabot[bot]' || contains(github.event.pull_request.labels.*.name, 'dependencies')
    steps:
      - name: Auto-merge Dependabot PRs when checks pass
        uses: pascalgn/automerge-action@v0.15.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          merge_method: squash
          # Require the default status checks to be successful before merging
          require: "status-success"
          # Optionally, add a comment when merged
          comment: "Auto-merged by Dependabot automerge workflow"
